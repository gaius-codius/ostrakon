name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# What runs here needs no Claude login and no secrets. The mod's own tests run in mod-tests, on the
# `claude` binary itself (the mods test kit ships inside it), which runs them without signing in.
#
# Type-checking: server/tsconfig.json covers the hub and every file of the mod that doesn't import
# the engine's types. The rest (plugin/hooks, plugin/tests, plugin/src/ui/*.tsx, plugin/src/focus.ts)
# is checked by tools/check.sh only: its declarations (plugin/.claude-plugin/types) are written by
# Claude Code when a logged-in session loads the mod (validate and test don't write them), and
# they're Claude Code's own files, rewritten each release, so they aren't kept in this repo.
jobs:
  hub-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile && bun run typecheck
        working-directory: server
      - run: bun test
        working-directory: server

  # claude plugin validate and claude plugin test, on the Claude Code version bin/tested-with names.
  # The binary is npm's linux-x64 (glibc) package, run unmodified; SHA256 is that tarball's, so
  # bumping claude= in bin/tested-with fails here until SHA256 is bumped with it (docs/releasing.md).
  # Not the @anthropic-ai/claude-code wrapper: its postinstall picks the platform, so there's no one
  # hash to pin.
  mod-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA256: eef5a2e2b09a5e7d2ce784d1b3ba335ae7fc6c7f6256c802a0ebf2c21e4fd0e1
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: |
          version=$(sed -n 's/^claude=//p' bin/tested-with)
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' -o claude.tgz "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${version}.tgz"
          echo "${SHA256}  claude.tgz" | sha256sum -c -
          tar -xzf claude.tgz --strip-components=1 package/claude
          chmod +x claude
          ./claude --version
      - run: '"$RUNNER_TEMP/claude" plugin validate plugin'
      # A run that finds no tests would pass too, so it has to report some passing.
      - run: |
          "$RUNNER_TEMP/claude" plugin test plugin | tee "$RUNNER_TEMP/test.log"
          grep -Eq '^ *[1-9][0-9]* pass$' "$RUNNER_TEMP/test.log" || { echo "no tests passed"; exit 1; }

  # The phone app in WebKit at iPhone size (tools/phone/README.md).
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile && bunx playwright-core install --with-deps webkit
        working-directory: tools/phone
      - run: tools/phone/run.sh
        env:
          PHONE_IN: host

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, so the design changelog can be held against the base's.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # docs/DESIGN.md against the code, and its changelog against the base branch (a pull request)
      # or the commit before (a push).
      - run: bun tools/check-design.ts --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: bun test ./tools/check-design.test.ts

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Errors only: the dev scripts are sourced helpers, so style warnings are noise.
      - run: shellcheck -s bash -S error tools/*.sh tools/*/*.sh bin/ostrakon bin/doctor get.sh install.sh update.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary itself, checksum-pinned, over the whole history: the action scans only
      # the pushed range, which fails on a branch's first push, and wants a license for organizations.
      - name: Scan for secrets
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner .

  # tools/lint.sh, with the tools at the versions mise.toml pins (the same ones you get locally).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: tools/lint.sh
