# The spell checker (typos), run by tools/lint.sh.
[files]
# Third-party files, kept as their authors ship them.
extend-exclude = ["server/public/vendor/", "server/public/fonts/"]

[default]
# A word cut short with an ellipsis is sample UI text (a truncated chip), not a typo; a design
# fingerprint in docs/DESIGN.md is a hash.
extend-ignore-re = ["\\w+…", "Fingerprint: [0-9a-f]+"]

[default.extend-words]
# Both spellings are standard English.
unparseable = "unparseable"
