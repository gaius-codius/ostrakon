<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ostrakon">
<title>Ostrakon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <h1 class="brand"><span class="pen" aria-hidden="true">✎</span>ostrakon</h1>
    <p id="status" class="status" role="status"></p>
  </header>
  <main id="main">
    <form id="capture" class="card" autocomplete="off">
      <label for="text" class="sr-only">Note</label>
      <textarea id="text" rows="3" placeholder="A note…" enterkeyhint="enter"></textarea>
      <div class="foot">
        <select id="project" aria-label="Project"><option value="">unfiled</option></select>
        <button id="save" type="submit" class="primary">Save</button>
      </div>
    </form>
    <section id="refused" aria-labelledby="refused-title" hidden>
      <h2 id="refused-title">Not accepted by the hub</h2>
      <ul id="refused-list"></ul>
    </section>
    <section id="inbox" aria-label="Open notes">
      <input id="filter" type="search" placeholder="Filter notes" aria-label="Filter notes" autocomplete="off">
      <div id="list"></div>
      <p id="empty" class="empty" hidden>No open notes.</p>
    </section>
  </main>
</div>
<main id="login" hidden>
  <form id="login-form" autocomplete="off">
    <h1>Ostrakon</h1>
    <p>Paste the hub token (<code>HUB_TOKEN</code>) to connect this phone.</p>
    <input id="token" type="password" placeholder="Token" aria-label="Token" autocapitalize="off" spellcheck="false">
    <button type="submit" class="primary">Connect</button>
    <p id="login-error" class="error" hidden>That token was refused.</p>
  </form>
</main>
<div id="sheet" class="sheet" hidden>
  <div id="sheet-scrim" class="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="group">
      <p id="sheet-title" class="title"></p>
      <div id="sheet-actions" class="actions"></div>
    </div>
    <button id="sheet-cancel" type="button" class="cancel">Cancel</button>
  </div>
</div>
<div id="toast" class="toast" hidden><span id="toast-text"></span><button id="toast-undo" type="button">Undo</button></div>
<script src="app.js"></script>
</body>
</html>
