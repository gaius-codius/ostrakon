<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ostrakon">
<title>Ostrakon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="list">
<div id="app" hidden>
  <header class="top">
    <h1 class="brand"><span class="pen" aria-hidden="true">✎</span>ostrakon</h1>
    <p id="status" class="status" role="status"></p>
    <button id="close-capture" type="button" class="link-btn" aria-label="Close; the draft is kept" hidden>Close</button>
    <button id="open-search" type="button" class="icon-btn" aria-label="Filter notes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg></button>
  </header>
  <div id="search-bar" class="search-bar" role="search" hidden>
    <div class="field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
      <label for="filter" class="sr-only">Filter notes</label>
      <input id="filter" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="clear-filter" type="button" class="icon-btn" aria-label="Clear filter" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <button id="cancel-search" type="button" class="link-btn">Cancel</button>
  </div>
  <main id="main">
    <form id="capture" class="card" autocomplete="off">
      <label for="text" class="sr-only">Note</label>
      <textarea id="text" rows="3" placeholder="A note…" enterkeyhint="enter"></textarea>
      <p id="saved" class="saved" role="status"></p>
      <fieldset id="chips" class="chips" hidden>
        <legend class="sr-only">Project</legend>
        <div id="chip-list" class="chip-list"></div>
      </fieldset>
      <div class="foot">
        <button id="pill" type="button" class="pill"></button>
        <p id="hint" class="hint" hidden></p>
        <button id="save" type="submit" class="primary" disabled>Save</button>
      </div>
    </form>
    <section id="refused" aria-labelledby="refused-title" hidden>
      <h2 id="refused-title">Not accepted by the hub</h2>
      <ul id="refused-list"></ul>
    </section>
    <p id="search-status" class="search-status" role="status"></p>
    <section id="inbox" aria-label="Open notes">
      <div id="list"></div>
      <div id="no-match" class="no-match" hidden>
        <p id="no-match-title" class="title"></p>
        <p>Archived and sent notes aren't searched.</p>
      </div>
      <p id="empty" class="empty" hidden>No open notes.</p>
    </section>
  </main>
</div>
<main id="login" hidden>
  <form id="login-form" autocomplete="off">
    <h1>Ostrakon</h1>
    <p>Paste the hub token (<code>HUB_TOKEN</code>) to connect this phone.</p>
    <input id="token" type="password" placeholder="Token" aria-label="Token" autocapitalize="off" spellcheck="false">
    <button type="submit" class="primary">Connect</button>
    <p id="login-error" class="error" hidden>That token was refused.</p>
  </form>
</main>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-text">
  <div id="sheet-scrim" class="scrim"></div>
  <div class="panel">
    <div class="group">
      <div class="head">
        <p class="quote"><span class="bar" aria-hidden="true">▎</span><span id="sheet-text"></span></p>
        <p id="sheet-meta" class="meta"></p>
      </div>
      <div id="sheet-actions" class="actions"></div>
    </div>
    <button id="sheet-cancel" type="button" class="cancel">Cancel</button>
  </div>
</dialog>
<dialog id="picker" class="drawer" aria-labelledby="picker-title">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="grabber" aria-hidden="true"></div>
    <div class="bar">
      <h2 id="picker-title">File under</h2>
      <button id="picker-done" type="button" class="link-btn">Done</button>
    </div>
    <label class="find">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
      <span class="sr-only">Search projects</span>
      <input id="picker-search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </label>
    <div class="picks-scroll">
      <ul id="picker-list" class="picks"></ul>
      <p id="picker-none" class="none" hidden>No project matches</p>
      <h3 class="always">always</h3>
      <button id="picker-unfiled" type="button" class="pick" aria-pressed="false"><span class="dot ring" aria-hidden="true"></span><span class="label">unfiled</span><span class="aside"></span></button>
    </div>
  </div>
</dialog>
<div id="toast" class="toast" hidden><span id="toast-text"></span><button id="toast-undo" type="button">Undo</button></div>
<p id="live" class="sr-only" role="status"></p>
<script src="app.js"></script>
</body>
</html>
